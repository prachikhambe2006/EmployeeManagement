<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Employee Management System</h1>

  <form id="employeeForm">
    <input type="text" id="empId" placeholder="Employee ID" required>
    <input type="text" id="empName" placeholder="Name" required>
    <input type="text" id="empDept" placeholder="Department" required>
    <input type="number" id="empSalary" placeholder="Salary" required>
    <button type="submit">Add Employee</button>
  </form>

  <input type="text" id="searchId" placeholder="Search by Employee ID">
  <button id="searchBtn">Search</button>

  <table id="empTable" border="1">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Department</th><th>Salary</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
